services:
  app:
    build:
      context: .
      args:
        # 1 = kèm docling (mô hình bố cục). Ảnh phình lên nhiều GB vì torch.
        WITH_LAYOUT: ${WITH_LAYOUT:-0}
    image: loupe
    ports:
      - "${PORT:-8010}:8010"
    env_file:
      - .env                # bắt buộc có OPENROUTER_API_KEY
    environment:
      # Không kèm docling thì phải tắt hẳn, nếu không mỗi lần nạp bài lại thử
      # import rồi mới rơi về đường lùi.
      LAYOUT_BACKEND: ${LAYOUT_BACKEND:-off}
    # Chạy bằng đúng uid/gid của người dùng trên máy chủ. Không có dòng này thì
    # container (uid 10001) không ghi nổi vào ./data của máy chủ (uid 1000) và
    # SQLite chết ngay với "unable to open database file".
    #   echo "DOCKER_UID=$(id -u)" >> .env ; echo "DOCKER_GID=$(id -g)" >> .env
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      # SQLite + PDF gốc + ảnh cắt ra. Nâng cấp ảnh không mất bài đã đọc.
      - ./data:/data
      # Mã nguồn đọc thẳng từ đĩa thay vì bản đã nướng vào ảnh. Không có hai
      # dòng này thì MỖI lần sửa giao diện đều phải `docker compose build`, và
      # quên là thấy y hệt bản cũ — đã mất cả buổi vì đúng chuyện đó.
      #   sửa web/    → F5 trên trình duyệt
      #   sửa server/ → docker compose restart
      #
      # Đánh đổi: mã trên đĩa CHE mã trong ảnh, nên đem ảnh sang máy khác mà
      # không có thư mục nguồn thì nó chạy bản cũ nằm trong ảnh. Chấp nhận được
      # với công cụ chạy local; bỏ hai dòng này nếu đem đi nơi khác.
      # `:ro` để container không ghi bậy vào mã nguồn.
      - ./web:/app/web:ro
      - ./server:/app/server:ro
    restart: unless-stopped
